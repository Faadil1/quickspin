name: Apply judge assurance hardening

on:
  push:
    branches:
      - judge-assurance-negative-path

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: judge-assurance-negative-path
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply hardening patch
        run: python3 scripts/apply-judge-assurance.py

      - name: Preserve failed gate evidence and ES2020 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test = Path('src/sdk/persistence.test.ts')
          text = test.read_text(encoding='utf-8')
          old = '    const rec = loadStorage().records.at(-1);'
          new = '    const records = loadStorage().records;\n    const rec = records[records.length - 1];'
          if old not in text:
              raise SystemExit('ES2020 compatibility marker not found')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')

          ledger = Path('evidence/FAILURE-LEDGER.md')
          current = ledger.read_text(encoding='utf-8')
          current += '''\n## F-04 — Judge-assurance gate rejected its own first pass\n\n- Event: GitHub Actions run `34928143854` failed at TypeScript typecheck.\n- Evidence: https://github.com/Faadil1/quickspin/actions/runs/34928143854\n- Cause: the newly added evidence test used `Array.prototype.at()`, but QuickSpin targets ES2020.\n- Mitigation: the test now uses index access compatible with the actual target.\n- Lesson: assurance code is subject to the same build truth as product code; a green narrative cannot override a red compiler.\n'''
          ledger.write_text(current, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format candidate
        run: npm run format

      - name: Quality gate
        run: |
          npm run check
          npm run build

      - name: Commit validated judge assurance pass
        run: |
          rm scripts/apply-judge-assurance.py
          rm .github/workflows/apply-judge-assurance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add failure evidence and judge assurance gates"
          git push origin judge-assurance-negative-path
