name: Apply native Black Box consolidation

on:
  workflow_dispatch:
  push:
    branches:
      - native-black-box-consolidation
    paths:
      - scripts/consolidate-native-black-box.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: native-black-box-consolidation
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/consolidate-native-black-box.mjs
      - run: npx prettier --write src/demo/main.ts src/demo/site.css index.html
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run judge:verify
      - run: npm run build
      - name: Commit consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/demo/main.ts src/demo/site.css index.html
          git diff --cached --quiet || git commit -m "design: consolidate native Black Box Arcade"
          git push origin native-black-box-consolidation
