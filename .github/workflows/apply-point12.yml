name: Apply point 12 execution signals

on:
  push:
    branches:
      - point-12-execution-signals

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: point-12-execution-signals
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply point 12 patch
        run: python scripts/apply-point12-v2.py

      - name: Install dependencies
        run: npm ci

      - name: Format candidate
        run: npm run format

      - name: Quality gate
        run: |
          npm run check
          npm run build

      - name: Commit validated execution signals layer
        shell: bash
        run: |
          rm -f scripts/apply-point12.py scripts/apply-point12-v2.py
          rm -f .github/workflows/apply-point12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated changes to commit."
            exit 0
          fi
          git commit -m "feat: add AI execution signals gameplay layer"
          git push origin HEAD:point-12-execution-signals
