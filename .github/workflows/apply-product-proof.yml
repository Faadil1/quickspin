name: Apply product proof overlay

on:
  push:
    branches:
      - product-proof-p0-p1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: product-proof-p0-p1
          fetch-depth: 0

      - name: Rebuild product proof overlay
        shell: bash
        run: |
          cat .quickspin-apply/part* > /tmp/quickspin-overlay.b64
          base64 --decode /tmp/quickspin-overlay.b64 > /tmp/quickspin-overlay.tar.gz
          tar -xzf /tmp/quickspin-overlay.tar.gz -C .
          sed -i 's/const cursor = new Date();/const cursor = new Date(Date.now());/' src/sdk/persistence.ts

      - name: Install dependencies
        run: npm ci

      - name: Format candidate
        run: npm run format

      - name: Quality gate
        run: |
          npm run check
          npm run build

      - name: Commit validated P0 + P1 pass
        shell: bash
        run: |
          rm -rf .quickspin-apply
          rm -f .github/workflows/apply-product-proof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated changes to commit."
            exit 0
          fi
          git commit -m "feat: complete P0+P1 product proof pass"
          git push origin HEAD:product-proof-p0-p1
