name: Apply redesign theme

on:
  push:
    branches:
      - multipage-future-classic-redesign

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: multipage-future-classic-redesign
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply theme patch
        run: python3 scripts/apply-future-classic-widget-theme.py
      - name: Install dependencies
        run: npm ci
      - name: Format and validate
        run: |
          npm run format
          npm run check
          npm run build
      - name: Commit validated theme integration
        run: |
          rm scripts/apply-future-classic-widget-theme.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/demo/main.ts scripts/apply-future-classic-widget-theme.py
          git commit -m "feat: align live widget with future-classic visual system"
          git push origin multipage-future-classic-redesign
