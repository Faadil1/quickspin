name: Apply Tavily real search

on:
  push:
    branches: [tavily-real-search]
    paths:
      - scripts/apply-tavily-real-search.mjs
      - .github/workflows/apply-tavily-real-search.yml
      - functions/api/search.js

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tavily-real-search
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-tavily-real-search.mjs
      - run: npm ci
      - run: npx prettier --write src/demo/main.ts src/demo/site.css
      - run: npm run check
      - run: npm run build
      - name: Commit integrated product and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/demo/main.ts src/demo/site.css functions/api/search.js
          git rm scripts/apply-tavily-real-search.mjs .github/workflows/apply-tavily-real-search.yml
          git commit -m "feat: make QuickSpin search real with Tavily"
          git push origin tavily-real-search
