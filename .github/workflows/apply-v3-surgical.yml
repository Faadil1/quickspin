name: Apply V3 open-space surgical patches

on:
  push:
    branches:
      - winning-intelligence-v3-open-space

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: winning-intelligence-v3-open-space
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-v3-surgical.mjs
      - run: npx prettier --write src/sdk/widget.ts src/demo/main.ts src/sdk/types.ts src/sdk/index.ts src/sdk/capsule.ts src/sdk/capsule.test.ts
      - run: npm run typecheck
      - run: npm run test
      - name: Commit patched product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sdk/widget.ts src/demo/main.ts src/sdk/types.ts src/sdk/index.ts src/sdk/capsule.ts src/sdk/capsule.test.ts
          git diff --cached --quiet || git commit -m "feat: wire privacy-safe Wait Ghost replay into QuickSpin"
          git push origin winning-intelligence-v3-open-space
