name: Apply Winning Intelligence V2

on:
  push:
    branches:
      - winning-intelligence-v2

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: winning-intelligence-v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-winning-intelligence-v2-fixed.mjs
      - run: npm run format
      - run: npm run typecheck
      - run: npm run test
      - run: npm run judge:verify
      - name: Commit migrated product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sdk/widget.ts src/sdk/persistence.test.ts src/demo/main.ts scripts/verify-judge-evidence.mjs
          git diff --cached --quiet || git commit -m "feat: apply Winning Intelligence V2 product deltas"
          git push origin winning-intelligence-v2
