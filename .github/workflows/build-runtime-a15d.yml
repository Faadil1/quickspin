name: Build exact runtime bundle a15d

on:
  push:
    branches:
      - runtime-deploy-a15d
    paths:
      - .github/workflows/build-runtime-a15d.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-deploy-a15d
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build exact native visual runtime
        env:
          GIT_COMMIT: a15d48a5090e6a9e7ce0c5bc803aa52f8ebb98c3
          DEPLOYMENT_ID: PENDING_DIRECT_VERCEL_DEPLOY
        run: npm run build
      - name: Stage deployable static bundle
        run: |
          rm -rf runtime-ready
          mkdir -p runtime-ready
          cp -R dist-demo/. runtime-ready/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-runtime-a15d.yml
          git add runtime-ready
          git commit -m "build: stage exact a15d runtime bundle"
          git push origin HEAD:runtime-deploy-a15d
