name: Complete native visuals

on:
  push:
    branches:
      - native-visual-completion
    paths:
      - scripts/complete-native-visuals.mjs
      - .github/workflows/complete-native-visuals.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-visual-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/complete-native-visuals.mjs
      - run: npm run release:verify
      - name: Commit validated native completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/complete-native-visuals.mjs .github/workflows/complete-native-visuals.yml
          git add src/demo/site.css vite.config.ts evidence/runtime/NATIVE-VISUAL-COMPLETION-2026-09-16.md
          git commit -m "design: complete native Black Box component system"
          git push origin HEAD:native-visual-completion
