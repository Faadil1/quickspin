name: Final judge patch

on:
  push:
    branches: [final-judge-package]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: final-judge-package
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Fix displayed SDK sample provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/demo/main.ts')
          text = p.read_text(encoding='utf-8')
          old1 = 'session.signal({ kind: <span class="tok-str">"retrieval"</span>, label: <span class="tok-str">"Retrieved 12 sources"</span> });'
          new1 = 'session.signal({ kind: <span class="tok-str">"retrieval"</span>, label: <span class="tok-str">"Retrieved 12 sources"</span>, evidenceRef: <span class="tok-str">"run_123:retrieval_4"</span> });'
          old2 = 'session.signal({ kind: <span class="tok-str">"artifact"</span>, label: <span class="tok-str">"Draft assembled"</span> });'
          new2 = 'session.signal({ kind: <span class="tok-str">"artifact"</span>, label: <span class="tok-str">"Draft assembled"</span>, evidenceRef: <span class="tok-str">"run_123:artifact_1"</span> });'
          if old1 not in text or old2 not in text:
              raise SystemExit('displayed SDK sample markers not found')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install
        run: npm ci

      - name: Format TypeScript
        run: npm run format

      - name: Full gate
        run: |
          npm run check
          npm run build

      - name: Commit validated sample fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/demo/main.ts
          git commit -m "fix: align displayed SDK sample with evidence contract"
          git push origin final-judge-package
