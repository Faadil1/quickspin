name: Format Black Box Arcade readonly

on:
  push:
    branches:
      - black-box-arcade-all-phases

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: black-box-arcade-all-phases
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/demo/black-box-arcade.ts
      - name: Print formatted file
        run: |
          echo '---BLACK_BOX_FORMATTED_START---'
          cat src/demo/black-box-arcade.ts
          echo '---BLACK_BOX_FORMATTED_END---'
