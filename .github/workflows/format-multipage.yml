name: Format multi-page candidate

on:
  push:
    branches:
      - multi-page-ambitious-visual

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: multi-page-ambitious-visual
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize candidate formatting
        run: npx prettier --write src/site/lab.ts src/site/shell.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/site/lab.ts src/site/shell.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize multi-page source formatting"
          git push origin multi-page-ambitious-visual
