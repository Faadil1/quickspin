name: Format redesign

on:
  push:
    branches:
      - multipage-future-classic-redesign

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: multipage-future-classic-redesign
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format redesign
        run: npm run format
      - name: Validate candidate
        run: |
          npm run check
          npm run build
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/demo/main.ts src/demo/future-classic.css index.html lab/index.html proof/index.html sdk/index.html judges/index.html vite.config.ts
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style: format future-classic multipage redesign"
            git push origin multipage-future-classic-redesign
          fi
