name: Inspect TRACE jury format

on:
  push:
    branches:
      - trace-visual-jury-v1

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: trace-visual-jury-v1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/demo/jury.ts
      - name: Print formatted jury enhancer
        run: |
          echo '-----JURY_TS_FORMATTED_BEGIN-----'
          cat src/demo/jury.ts
          echo '-----JURY_TS_FORMATTED_END-----'
