name: Patch canonical Cloudflare handoff

on:
  push:
    branches: [canonical-cloudflare-microwait-handoff]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: canonical-cloudflare-microwait-handoff
          fetch-depth: 0

      - name: Patch canonical state and handoff
        shell: python
        run: |
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected 1 match, got {count}: {old!r}")
                  text = text.replace(old, new, 1)
              p.write_text(text)

          patch("HACKATHON-STATE.yaml", [
              ("canonical_main_sha: bd34a8e0cb901630dd49945fd66fc8821e437a31", "canonical_main_sha: 1012c491f01cd3e1572d86a1ed43089007922868"),
              ("state: PUBLIC_RUNTIME_TAVILY_SEARCH_DEPLOYED_PENDING_E2E_POST_VERIFY", "state: CLOUDFLARE_TAVILY_E2E_VERIFIED_MICROWAIT_HARDENING_MERGED_PENDING_CANONICAL_SMOKE"),
              ("PROJECT_FINISHER: ACTIVE_LIVE_TAVILY_E2E_AND_FINAL_VISUAL_QA", "PROJECT_FINISHER: ACTIVE_CLOUDFLARE_MICROWAIT_SMOKE_AND_FINAL_VISUAL_QA"),
              ("EXECUTION: PASS_REAL_SEARCH_PROVIDER_DEPLOYED", "EXECUTION: PASS_REAL_SEARCH_PROVIDER_CLOUDFLARE_E2E_WITH_MICROWAIT_HARDENING_MERGED"),
              ("DEMO: PUBLIC_TAVILY_RUNTIME_DEPLOYED_PENDING_LIVE_POST_AND_VISUAL_REHEARSAL", "DEMO: CLOUDFLARE_TAVILY_E2E_OBSERVED_PRE_HARDENING_PENDING_CANONICAL_1012C49_SMOKE"),
              ("QA: PREPARED_PENDING_BROWSER_LEVEL_REAL_SEARCH_REHEARSAL", "QA: PREPARED_PENDING_CANONICAL_MICROWAIT_AND_VISUAL_REHEARSAL"),
              ("DELIVER: PASS_REAL_SEARCH_RUNTIME_PROMOTED", "DELIVER: PASS_CLOUDFLARE_REAL_SEARCH_RUNTIME_WITH_HARDENING_MERGED"),
              ("AUDIT: PASS_HTTP_SOURCE_FUNCTION_BUILD_JSON_AND_IMMUTABLE_ASSET_PROOF", "AUDIT: PASS_CLOUDFLARE_WORKER_TAVILY_E2E_PLUS_GREEN_HARDENING_BUILDS"),
              ("critical_path_assurance: PASS_WITH_LIVE_POST_AND_FINAL_VISUAL_CAPTURE_PENDING", "critical_path_assurance: PASS_WITH_CANONICAL_HARDENING_SMOKE_AND_FINAL_VISUAL_CAPTURE_PENDING"),
              ("real_search_provider_backend: PASS_VERCEL_FUNCTION_DEPLOYED", "real_search_provider_backend: PASS_CLOUDFLARE_WORKER_E2E_OBSERVED"),
              ("tavily_server_secret_boundary: PASS_SERVER_ONLY_ENV_REFERENCE_NO_CLIENT_KEY", "tavily_server_secret_boundary: PASS_CLOUDFLARE_WORKER_ENV_NO_CLIENT_KEY"),
              ("tavily_function_route: PASS_GET_405_POST_OPTIONS_ALLOWED_NO_STORE", "tavily_function_route: PASS_CLOUDFLARE_WORKER_POST_API_ROUTE"),
              ("tavily_live_post_e2e: PENDING_BROWSER_OR_POST_CAPABLE_VERIFICATION", "tavily_live_post_e2e: PASS_OBSERVED_IN_USER_VIDEO_WITH_SOURCED_RESULTS_AND_EVIDENCE_REFS"),
              ("exact_tavily_ci_run: PASS_35178217467", "exact_tavily_ci_run: PASS_35179790534_CLOUDFLARE_WORKER_DRY_RUN"),
              ("exact_runtime_build_run: PASS_35178451390", "exact_runtime_build_run: PASS_35203974036_AND_35204077032_MICROWAIT_HARDENING"),
              ("public_runtime: PASS_TAVILY_VERCEL_RUNTIME_DEPLOYED", "public_runtime: PASS_CLOUDFLARE_TAVILY_E2E_PRE_HARDENING_CANONICAL_HARDENING_PENDING_SMOKE"),
              ("public_runtime_url: https://quickspin-runtime-native.vercel.app", "public_runtime_url: https://quickspin.faadil-casecraft.workers.dev"),
              ("public_runtime_project_id: prj_fBE7dDskvIkzFDTubRmI88MRUM31", "public_runtime_project_id: CLOUDFLARE_WORKER_QUICKSPIN"),
              ("public_runtime_deployment_id: dpl_9eBrosDYyFKs6i4bBkYbWkLim5iu", "public_runtime_deployment_id: PENDING_EXACT_1012C49_CANONICAL_DEPLOYMENT_ID"),
              ("public_runtime_source_sha: bd34a8e0cb901630dd49945fd66fc8821e437a31", "public_runtime_source_sha: 1012c491f01cd3e1572d86a1ed43089007922868_PENDING_CANONICAL_SMOKE"),
              ("public_runtime_packaging: VERCEL_FUNCTION_PLUS_IMMUTABLE_JSDLIVR_COMMIT", "public_runtime_packaging: CLOUDFLARE_WORKER_PLUS_ASSETS_BINDING_RUN_WORKER_FIRST_API"),
              ("public_search_route_get_probe: PASS_HTTP_405_ALLOW_POST_OPTIONS_NO_STORE", "public_search_route_get_probe: SUPERSEDED_BY_SUCCESSFUL_CLOUDFLARE_POST_E2E"),
              ("search_function_max_duration: 15_SECONDS", "search_function_max_duration: CLOUDFLARE_WORKER_PLATFORM_MANAGED"),
              ("search_rate_limit: SOFT_PER_SERVERLESS_INSTANCE_8_PER_60_SECONDS", "search_rate_limit: SOFT_PER_WORKER_ISOLATE_8_PER_60_SECONDS"),
              ("fast_response_anti_flash: PASS_IN_IMPLEMENTATION", "fast_response_anti_flash: PASS_MERGED_PR22_1800MS_THRESHOLD_PENDING_CANONICAL_VISUAL_SMOKE"),
              ("ux_ui: PASS_TAVILY_LAB_BUNDLE_SERVED_PENDING_BROWSER_VISUAL_INSPECTION", "ux_ui: PASS_TAVILY_E2E_OBSERVED_MICROWAIT_HARDENING_MERGED_PENDING_CANONICAL_VISUAL_SMOKE"),
              ("demo_path: PUBLIC_RUNTIME_READY_PENDING_LIVE_TAVILY_POST_REHEARSAL_AND_CAPTURE", "demo_path: CLOUDFLARE_TAVILY_E2E_READY_PENDING_HARDENING_SMOKE_REHEARSAL_AND_CAPTURE"),
              ("build_readiness: PUBLIC_TAVILY_BUILD_DEPLOYED_PENDING_POST_VERIFY", "build_readiness: MICROWAIT_HARDENING_MERGED_AND_GREEN_PENDING_CANONICAL_CLOUDFLARE_SMOKE"),
              ("handoff_to_finisher: ACTIVE_LIVE_TAVILY_E2E_AND_FINAL_VISUAL_QA", "handoff_to_finisher: ACTIVE_CLOUDFLARE_MICROWAIT_SMOKE_AND_FINAL_VISUAL_QA"),
              ("final_qc: READY_FOR_LIVE_POST_AND_VISUAL_QA", "final_qc: READY_FOR_CANONICAL_HARDENING_SMOKE_AND_VISUAL_QA"),
              ("  - LIVE_TAVILY_POST_E2E_VERIFY_FROM_PUBLIC_LAB\n", "  - CANONICAL_CLOUDFLARE_DEPLOY_1012C491_AND_SMOKE\n  - VERIFY_STALE_RESULTS_CLEAR_IMMEDIATELY_ON_NEW_QUERY\n  - VERIFY_FAST_PATH_LT_1800MS_STAYS_PASSIVE_WITHOUT_GHOST\n"),
              ("next_decision: Open https://quickspin-runtime-native.vercel.app/lab and run a real query. Confirm Tavily returns one to five sourced result cards with working source links, that the wait duration follows the real provider request, that Evidence Capsule and redacted Wait Ghost still work, and that provider failure never fabricates results. Then complete desktop/mobile/reduced-motion inspection, rehearsal, and final demo capture.", "next_decision: Deploy main product SHA 1012c491f01cd3e1572d86a1ed43089007922868 to the canonical Cloudflare Worker, then open https://quickspin.faadil-casecraft.workers.dev/lab. Run two back-to-back queries to verify stale results clear immediately, verify a sub-1800ms response stays passive with no Wait Ghost, and verify a slower response still mounts QuickSpin and produces Capsule plus redacted Ghost. Then complete desktop/mobile/reduced-motion inspection, rehearsal, and final demo capture."),
          ])

          patch("HACKATHON-HANDOFF.yaml", [
              ("from: PUBLIC_RUNTIME_TAVILY_SEARCH_DEPLOYED_PENDING_E2E_POST_VERIFY", "from: CLOUDFLARE_TAVILY_E2E_VERIFIED_PRE_HARDENING"),
              ("to: LIVE_TAVILY_E2E_AND_FINAL_VISUAL_QA", "to: CANONICAL_CLOUDFLARE_MICROWAIT_SMOKE_AND_FINAL_VISUAL_QA"),
              ("handoff_status: ACTIVE_LIVE_TAVILY_E2E_AND_FINAL_VISUAL_QA", "handoff_status: ACTIVE_CLOUDFLARE_MICROWAIT_SMOKE_AND_FINAL_VISUAL_QA"),
              ("readiness: PUBLIC_TAVILY_BUILD_DEPLOYED_PENDING_POST_VERIFY", "readiness: PRODUCT_HARDENING_MERGED_GREEN_PENDING_CANONICAL_CLOUDFLARE_SMOKE"),
              ("  - exact_product_source_sha_bd34a8e0cb901630dd49945fd66fc8821e437a31\n", "  - exact_product_source_sha_1012c491f01cd3e1572d86a1ed43089007922868\n  - cloudflare_worker_tavily_post_e2e_observed_in_user_video\n  - live_sourced_result_cards_and_urls_observed\n  - result_urls_observed_as_quickspin_evidence_refs\n  - pr22_micro_wait_and_stale_output_hardening_merged\n  - hardening_workflow_35203974036_check_and_build_green\n  - hardening_workflow_35204077032_check_and_build_green\n"),
              ("not_yet_verified:\n  - successful_production_post_to_api_search_with_tavily_response\n  - user_visible_one_to_five_real_result_cards_from_public_lab\n  - working_outbound_source_links_from_a_successful_live_query\n  - browser_level_real_search_timing_and_quickspin_transition\n", "not_yet_verified:\n  - canonical_cloudflare_deployment_of_source_1012c491_and_exact_deployment_id\n  - stale_result_cleanup_on_two_back_to_back_queries_on_canonical_runtime\n  - sub_1800ms_fast_path_stays_passive_without_wait_ghost\n  - slower_than_1800ms_query_still_mounts_quickspin_and_derives_ghost\n"),
              ("  url: https://quickspin-runtime-native.vercel.app", "  url: https://quickspin.faadil-casecraft.workers.dev"),
              ("  lab_url: https://quickspin-runtime-native.vercel.app/lab", "  lab_url: https://quickspin.faadil-casecraft.workers.dev/lab"),
              ("  api_search_url: https://quickspin-runtime-native.vercel.app/api/search", "  api_search_url: https://quickspin.faadil-casecraft.workers.dev/api/search"),
              ("  build_attestation_url: https://quickspin-runtime-native.vercel.app/build.json", "  build_attestation_url: https://quickspin.faadil-casecraft.workers.dev/build.json"),
              ("  project_id: prj_fBE7dDskvIkzFDTubRmI88MRUM31", "  project_id: CLOUDFLARE_WORKER_QUICKSPIN"),
              ("  deployment_id: dpl_9eBrosDYyFKs6i4bBkYbWkLim5iu", "  deployment_id: PENDING_EXACT_1012C491_CANONICAL_DEPLOYMENT_ID"),
              ("  source_sha: bd34a8e0cb901630dd49945fd66fc8821e437a31", "  source_sha: 1012c491f01cd3e1572d86a1ed43089007922868"),
              ("  packaging: vercel_function_plus_immutable_jsdelivr_commit", "  packaging: cloudflare_worker_plus_assets_binding_run_worker_first_api"),
              ("  live_web_search: IMPLEMENTED_AND_DEPLOYED_PENDING_SUCCESSFUL_POST_E2E_CONFIRMATION", "  live_web_search: IMPLEMENTED_AND_E2E_OBSERVED_ON_CLOUDFLARE"),
              ("  quickspin_mode: REAL_TAVILY_REQUEST_WITH_PLAYABLE_WAIT", "  quickspin_mode: REAL_TAVILY_REQUEST_WITH_1800MS_PLAYABLE_THRESHOLD"),
              ("search_runtime_policy:\n  method: POST_ONLY_WITH_OPTIONS", "search_runtime_policy:\n  platform: CLOUDFLARE_WORKER\n  method: POST_ONLY_WITH_OPTIONS"),
              ("  function_max_duration_seconds: 15\n", "  function_max_duration_seconds: PLATFORM_MANAGED\n  keep_vars: true\n"),
              ("  rate_limit: SOFT_IN_MEMORY_PER_SERVERLESS_INSTANCE_8_REQUESTS_PER_60_SECONDS", "  rate_limit: SOFT_IN_MEMORY_PER_WORKER_ISOLATE_8_REQUESTS_PER_60_SECONDS"),
              ("  after_successful_quickspin_run: REVEALED", "  after_successful_quickspin_run: REVEALED_ONLY_WHEN_PROVIDER_WAIT_REACHES_1800MS_PLAY_THRESHOLD"),
              ("  - run_successful_real_tavily_query_from_public_lab\n  - confirm_one_to_five_sourced_result_cards_and_outbound_links\n  - confirm_real_provider_latency_drives_wait_and_quickspin_transition\n", "  - deploy_source_1012c491_to_canonical_cloudflare_worker_and_record_exact_version\n  - verify_two_back_to_back_queries_clear_stale_results_immediately\n  - verify_sub_1800ms_fast_path_stays_passive_and_suppresses_wait_ghost\n  - verify_slower_query_still_drives_playable_quickspin_transition\n"),
              ("rollback: Current product source is bd34a8e0cb901630dd49945fd66fc8821e437a31, immutable asset artifact is 83dba91c52b013314cec4278245f627788e69c33, and production deployment is dpl_9eBrosDYyFKs6i4bBkYbWkLim5iu. Previous verified production deployment dpl_8XjpBY4rsghPn4sgjDt1q7s4F5B4 with source e2a115cccbc3daa547cea42a5c1d966e8a7d4987 and artifact f6fa995aed0cc93204d039e6b848877b3f6e1d4d remains recoverable. Failed promotion dpl_G5aLCDikz3tMgGBSC2vBjRsXxgyn remains preserved as red evidence.", "rollback: Cloudflare pre-hardening Tavily E2E remains the last observed live success surface. Product source 1012c491f01cd3e1572d86a1ed43089007922868 is the current hardening target pending canonical smoke. Vercel deployment dpl_9eBrosDYyFKs6i4bBkYbWkLim5iu and prior verified Vercel deployments remain secondary rollback references; failed promotion dpl_G5aLCDikz3tMgGBSC2vBjRsXxgyn remains preserved as red evidence."),
          ])

      - name: Commit canonical docs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-canonical-cloudflare-handoff.yml
          git add HACKATHON-STATE.yaml HACKATHON-HANDOFF.yaml
          git commit -m "docs: hand off Cloudflare micro-wait smoke [skip ci]"
          git push origin HEAD:canonical-cloudflare-microwait-handoff
