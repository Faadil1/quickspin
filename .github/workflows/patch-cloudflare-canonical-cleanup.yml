name: Clean Cloudflare canonical handoff

on:
  push:
    branches: [canonical-cloudflare-microwait-handoff]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: canonical-cloudflare-microwait-handoff
          fetch-depth: 0
      - name: Remove stale Vercel-as-canonical fields
        shell: python
        run: |
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected 1 match, got {count}: {old!r}")
                  text = text.replace(old, new, 1)
              p.write_text(text)

          patch("HACKATHON-STATE.yaml", [
              ("  immutable_runtime_artifact_commit: 83dba91c52b013314cec4278245f627788e69c33\n  runtime_build_attestation: PASS_PUBLIC_BUILD_JSON\n", "  secondary_vercel_immutable_runtime_artifact_commit: 83dba91c52b013314cec4278245f627788e69c33\n  runtime_build_attestation: PENDING_CANONICAL_1012C491_CLOUDFLARE_BUILD_JSON_SMOKE\n"),
              ("  public_runtime_assets: PASS_IMMUTABLE_JS_CSS_REFERENCED_FROM_ARTIFACT_COMMIT\n  public_runtime_js_bundle: index-DNWGy0HB.js\n  public_runtime_css_bundle: index-Dd1XOf5h.css\n", "  public_runtime_assets: PASS_CLOUDFLARE_ASSETS_PRE_HARDENING_HARDENED_ASSETS_PENDING_CANONICAL_SMOKE\n  public_runtime_js_bundle: PENDING_CANONICAL_1012C491_DEPLOY_OBSERVATION\n  public_runtime_css_bundle: PENDING_CANONICAL_1012C491_DEPLOY_OBSERVATION\n"),
              ("  - SOFT_RATE_LIMIT_IS_PER_SERVERLESS_INSTANCE_NOT_DISTRIBUTED_WAF\n", "  - SOFT_RATE_LIMIT_IS_PER_WORKER_ISOLATE_NOT_DISTRIBUTED_WAF\n"),
          ])

          patch("HACKATHON-HANDOFF.yaml", [
              ("  artifact_commit: 83dba91c52b013314cec4278245f627788e69c33\n  exact_ci_run: 35178217467\n  exact_runtime_build_run: 35178451390\n  js_bundle: index-DNWGy0HB.js\n  css_bundle: index-Dd1XOf5h.css\n", "  secondary_vercel_artifact_commit: 83dba91c52b013314cec4278245f627788e69c33\n  exact_cloudflare_worker_ci_run: 35179790534\n  exact_hardening_validation_runs: [35203974036, 35204077032]\n  js_bundle: PENDING_CANONICAL_1012C491_DEPLOY_OBSERVATION\n  css_bundle: PENDING_CANONICAL_1012C491_DEPLOY_OBSERVATION\n"),
              ("  - successful Tavily production POST is end_to_end verified before one is observed\n", "  - micro_wait_hardening_is_live_on_the_canonical_cloudflare_url_before_the_1012c491_smoke_is_observed\n"),
              ("  - soft_per_instance_rate_limit_is_a_global_distributed_abuse_barrier\n", "  - soft_per_worker_isolate_rate_limit_is_a_global_distributed_abuse_barrier\n"),
          ])
      - name: Commit docs cleanup only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-cloudflare-canonical-cleanup.yml
          git add HACKATHON-STATE.yaml HACKATHON-HANDOFF.yaml
          git commit -m "docs: remove stale Vercel fields from Cloudflare canon [skip ci]"
          git push origin HEAD:canonical-cloudflare-microwait-handoff
