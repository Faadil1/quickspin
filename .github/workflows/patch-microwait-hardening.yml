name: Patch micro-wait hardening

on:
  push:
    branches: [quickspin-microwait-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: quickspin-microwait-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply deterministic UX patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/demo/main.ts")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, got {count}: {old[:120]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              'const DEFAULT_PROMPT = "Where should five friends eat tonight in Austin?";\n',
              'const DEFAULT_PROMPT = "Where should five friends eat tonight in Austin?";\nconst PLAYABLE_WAIT_THRESHOLD_MS = 1800;\n',
          )

          replace_once(
              '    delayMs: 650,\n',
              '    delayMs: PLAYABLE_WAIT_THRESHOLD_MS,\n',
          )

          replace_once(
              '''  const appendSearchResults = (search: SearchSuccess): void => {\n''',
              '''  const clearSearchOutput = (): void => {\n    for (const panel of [classicPanel, qsPanel]) {\n      panel\n        .querySelectorAll<HTMLElement>(".demo-results, .search-failure, .search-pending")\n        .forEach((node) => node.remove());\n    }\n  };\n\n  const showSearchPending = (prompt: string): void => {\n    const panel = mode === "classic" ? classicPanel : qsPanel;\n    const chat = panel.querySelector<HTMLElement>(".chat")!;\n    const pending = document.createElement("div");\n    pending.className = "bubble ai search-pending";\n    pending.textContent = `Searching Tavily for “${prompt}”…`;\n    chat.appendChild(pending);\n  };\n\n  const clearSearchPending = (): void => {\n    app.querySelectorAll<HTMLElement>(".search-pending").forEach((node) => node.remove());\n  };\n\n  const appendSearchResults = (search: SearchSuccess): void => {\n''',
          )

          replace_once(
              '''  const appendSearchFailure = (message: string): void => {\n    appendBubble(`Search failed: ${message}`, "ai");\n  };\n''',
              '''  const appendSearchFailure = (message: string): void => {\n    const panel = mode === "classic" ? classicPanel : qsPanel;\n    const chat = panel.querySelector<HTMLElement>(".chat")!;\n    const bubble = document.createElement("div");\n    bubble.className = "bubble ai search-failure";\n    bubble.textContent = `Search failed: ${message}`;\n    chat.appendChild(bubble);\n  };\n''',
          )

          replace_once(
              '''      classicPhase.textContent = `Tavily returned ${search.results.length} sourced result(s) in ${search.elapsedMs} ms.`;\n      appendSearchResults(search);\n''',
              '''      classicPhase.textContent = `Tavily returned ${search.results.length} sourced result(s) in ${search.elapsedMs} ms.`;\n      clearSearchPending();\n      appendSearchResults(search);\n''',
          )

          replace_once(
              '''      classicPhase.textContent = `FAILED — ${failure.message}`;\n      appendSearchFailure(failure.message);\n''',
              '''      classicPhase.textContent = `FAILED — ${failure.message}`;\n      clearSearchPending();\n      appendSearchFailure(failure.message);\n''',
          )

          replace_once(
              '''      session.setPhase("Rendering sourced answer…");\n      session.complete();\n      appendSearchResults(search);\n      const capsule = ctrl.getLastCapsule();\n      phaseEl.innerHTML = `Phase: <strong>Done</strong> — Tavily returned <strong>${search.results.length}</strong> sourced result(s) in <strong>${search.elapsedMs} ms</strong>. Evidence Capsule retained <strong>${capsule?.evidenceCoverage.acceptedSignals ?? 0}</strong> accepted signal(s).`;\n      revealGhostTools();\n      ghostStatus.textContent =\n        "Replay-safe Wait Ghost ready from this real search run. The Ghost excludes the prompt, result titles and source URLs.";\n      refreshStats();\n      showGhostComparison();\n''',
              '''      session.setPhase("Rendering sourced answer…");\n      session.complete();\n      clearSearchPending();\n      appendSearchResults(search);\n      const capsule = ctrl.getLastCapsule();\n      const playableWait = search.elapsedMs >= PLAYABLE_WAIT_THRESHOLD_MS;\n      if (playableWait) {\n        phaseEl.innerHTML = `Phase: <strong>Done</strong> — Tavily returned <strong>${search.results.length}</strong> sourced result(s) in <strong>${search.elapsedMs} ms</strong>. Evidence Capsule retained <strong>${capsule?.evidenceCoverage.acceptedSignals ?? 0}</strong> accepted signal(s).`;\n        revealGhostTools();\n        ghostStatus.textContent =\n          "Replay-safe Wait Ghost ready from this real search run. The Ghost excludes the prompt, result titles and source URLs.";\n        showGhostComparison();\n      } else {\n        hideGhostTools();\n        phaseEl.innerHTML = `Phase: <strong>Done</strong> — Tavily returned <strong>${search.results.length}</strong> sourced result(s) in <strong>${search.elapsedMs} ms</strong>. Fast path: response arrived before the <strong>${PLAYABLE_WAIT_THRESHOLD_MS} ms</strong> play threshold, so the game stayed passive. The Evidence Capsule still records the real wait.`;\n      }\n      refreshStats();\n''',
          )

          replace_once(
              '''      session.fail(failure);\n      phaseEl.innerHTML = `Phase: <strong>FAILED</strong> — ${failure.message}. No search results were fabricated.`;\n      appendSearchFailure(failure.message);\n''',
              '''      session.fail(failure);\n      phaseEl.innerHTML = `Phase: <strong>FAILED</strong> — ${failure.message}. No search results were fabricated.`;\n      clearSearchPending();\n      appendSearchFailure(failure.message);\n''',
          )

          replace_once(
              '''    const prompt = promptInput.value.trim() || DEFAULT_PROMPT;\n    promptInput.value = prompt;\n    appendBubble(prompt, "user");\n''',
              '''    const prompt = promptInput.value.trim() || DEFAULT_PROMPT;\n    promptInput.value = prompt;\n    clearSearchOutput();\n    hideGhostTools();\n    appendBubble(prompt, "user");\n    showSearchPending(prompt);\n''',
          )

          replace_once(
              '''    const perceived = perceivedWaitStats();\n    set("stat-felt", perceived.samples > 0 ? `${Math.round(perceived.avgRatio * 100)}%` : "—");\n''',
              '''    const playedWait = totalWaitTurnedToPlayMs();\n    const perceived = perceivedWaitStats();\n    set(\n      "stat-felt",\n      playedWait > 0 && perceived.samples > 0 ? `${Math.round(perceived.avgRatio * 100)}%` : "—"\n    );\n''',
          )

          path.write_text(text)

      - run: npx prettier --write src/demo/main.ts
      - run: npm run check
      - run: npm run build

      - name: Commit product patch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-microwait-hardening.yml
          git add src/demo/main.ts
          git commit -m "ux: suppress stale results and micro-wait flash [skip ci]"
          git push origin HEAD:quickspin-microwait-hardening
