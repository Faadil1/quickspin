name: Security reconcile

on:
  push:
    branches:
      - finalization-security-runtime

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: finalization-security-runtime
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Capture npm audit and outdated reports
        shell: bash
        run: |
          mkdir -p evidence/security
          npm audit --json > evidence/security/npm-audit.json || true
          npm outdated --json > evidence/security/npm-outdated.json || true

      - name: Summarize dependency risk
        run: |
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('evidence/security/npm-audit.json','utf8'));
          const vulns = audit.vulnerabilities || {};
          const rows = Object.entries(vulns).map(([name,v]) => ({
            name,
            severity:v.severity,
            direct:!!v.isDirect,
            via:(v.via||[]).map(x => typeof x === 'string' ? x : `${x.name}:${x.title}`).join('; '),
            range:v.range || '',
            fix: typeof v.fixAvailable === 'object' ? `${v.fixAvailable.name}@${v.fixAvailable.version}${v.fixAvailable.isSemVerMajor?' (major)':''}` : String(v.fixAvailable)
          }));
          const counts = audit.metadata?.vulnerabilities || {};
          let md = '# Dependency Security Reconciliation\n\n';
          md += `Generated from npm audit on ${new Date().toISOString()}.\n\n`;
          md += `Counts: ${JSON.stringify(counts)}\n\n`;
          md += '| Package | Severity | Direct | Range | Fix | Via |\n|---|---|---:|---|---|---|\n';
          for (const r of rows) md += `| ${r.name} | ${r.severity} | ${r.direct} | ${r.range.replace(/\|/g,'\\|')} | ${r.fix.replace(/\|/g,'\\|')} | ${r.via.replace(/\|/g,'\\|')} |\n`;
          md += '\n## Interpretation rule\n\nA package count alone does not establish shipped-runtime exploitability. We classify each advisory by direct/transitive status, build-time/runtime reachability, and whether the vulnerable code ships in `dist/`. No `npm audit fix --force` is permitted without this reconciliation.\n';
          fs.writeFileSync('evidence/security/DEPENDENCY-SECURITY-RECONCILIATION.md', md);
          NODE

      - name: Verify existing gates still pass
        run: npm run check

      - name: Commit audit evidence
        run: |
          rm .github/workflows/security-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture dependency security evidence"
          git push origin finalization-security-runtime
