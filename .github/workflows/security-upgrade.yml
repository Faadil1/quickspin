name: Security upgrade validation

on:
  push:
    branches:
      - finalization-security-runtime

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: finalization-security-runtime
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade supported development toolchain
        run: npm install --save-dev vite@7.3.6 vitest@5.0.0

      - name: Adapt tests and preserve migration failures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/sdk/state-machine.test.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace('import type { SessionStatus } from "./types";', 'import type { SessionStatus, WaitEvent } from "./types";')
          old = '''function make(onEvent?: ReturnType<typeof vi.fn>) {\n  const emit = onEvent ?? vi.fn();\n  return { machine: new SessionStateMachine(emit), emit };\n}'''
          new = '''function make() {\n  const emit = vi.fn<(event: WaitEvent) => void>();\n  return { machine: new SessionStateMachine(emit), emit };\n}'''
          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace('''  it("emits phase {from,to} and progress events", () => {\n    const emit = vi.fn();\n    const { machine } = make(emit);''', '''  it("emits phase {from,to} and progress events", () => {\n    const { machine, emit } = make();''')
          p.write_text(text, encoding='utf-8')

          ledger = Path('evidence/FAILURE-LEDGER.md')
          current = ledger.read_text(encoding='utf-8')
          entries = [
          '''\n## F-05 — Secure toolchain migration first pass failed\n\n- Event: GitHub Actions run `34928931640` failed during `npm run typecheck`.\n- Evidence: https://github.com/Faadil1/quickspin/actions/runs/34928931640\n- Cause: Vitest 5 tightened `vi.fn()` typing; the test helper passed an untyped generic mock where `WaitEventHandler` was required.\n- Mitigation: the test now creates an explicitly typed `(event: WaitEvent) => void` mock.\n- Lesson: dependency security upgrades must pass the actual compiler/test contract; a zero-vulnerability install alone is not sufficient evidence.\n''',
          '''\n## F-06 — Vite 8 migration exposed a Rolldown TSX incompatibility\n\n- Event: GitHub Actions run `34929036325` passed typecheck and all 33 Vitest 5 tests, then failed in the SDK library build.\n- Evidence: https://github.com/Faadil1/quickspin/actions/runs/34929036325\n- Cause: Vite 8 switched the production bundler to Rolldown, which rejected the existing React TSX library entry without additional parser migration.\n- Decision: use the supported Vite 7.3 security line, retaining the proven Rollup build path while closing the advisories.\n- Lesson: latest-major adoption is not itself a quality gate; choose the smallest supported change that removes verified risk.\n''',
          '''\n## F-07 — Security gate passed but workflow mutation push was refused\n\n- Event: GitHub Actions run `34929187191` passed build, 33 tests, judge verification, full audit, production audit, and package-boundary checks, then failed only while pushing the commit.\n- Evidence: https://github.com/Faadil1/quickspin/actions/runs/34929187191\n- Cause: the Actions token was not permitted to update `.github/workflows/ci.yml` without GitHub `workflows` permission.\n- Mitigation: separate product/security changes from workflow-governance changes. The bot commits only package/test/evidence state; workflow updates are applied through the authorized GitHub connection.\n- Lesson: evidence generation and repository governance are separate authority surfaces; passing evidence does not grant permission to mutate CI policy.\n''']
          markers = [
            '## F-05 — Secure toolchain migration first pass failed',
            '## F-06 — Vite 8 migration exposed a Rolldown TSX incompatibility',
            '## F-07 — Security gate passed but workflow mutation push was refused',
          ]
          for marker, entry in zip(markers, entries):
              if marker not in current:
                  current += entry
          ledger.write_text(current, encoding='utf-8')
          PY

      - name: Format
        run: npm run format

      - name: Full quality gate
        run: |
          npm run check
          npm run build

      - name: Require clean audits
        run: |
          mkdir -p evidence/security
          npm audit --json > evidence/security/npm-audit-post-upgrade.json
          npm audit --omit=dev --json > evidence/security/npm-audit-production.json

      - name: Capture package boundary
        run: npm pack --dry-run --json > evidence/security/npm-pack-dry-run.json

      - name: Write security evidence and canonical state
        run: |
          node <<'NODE'
          const fs = require('fs');
          const full = JSON.parse(fs.readFileSync('evidence/security/npm-audit-post-upgrade.json','utf8'));
          const prod = JSON.parse(fs.readFileSync('evidence/security/npm-audit-production.json','utf8'));
          const pack = JSON.parse(fs.readFileSync('evidence/security/npm-pack-dry-run.json','utf8'));
          const fullTotal = full.metadata?.vulnerabilities?.total || 0;
          const prodTotal = prod.metadata?.vulnerabilities?.total || 0;
          const files = pack?.[0]?.files?.map(x => x.path) || [];
          const forbidden = files.filter(p => p.startsWith('node_modules/') || p.includes('vite') || p.includes('vitest'));
          if (fullTotal !== 0 || prodTotal !== 0 || forbidden.length) {
            throw new Error(`security gate failed: full=${fullTotal}, prod=${prodTotal}, forbidden=${forbidden.join(',')}`);
          }
          fs.writeFileSync('evidence/security/SECURITY-GATE.md', `# Dependency Security Gate — PASS\n\nValidated on ${new Date().toISOString()}.\n\n- Vite: 7.3.6 (supported security line)\n- Vitest: 5.0.0\n- Build/test Node floor: 22.12+\n- Full npm audit: **0 vulnerabilities**\n- Production-only npm audit: **0 vulnerabilities**\n- npm pack dry-run: **no Vite/Vitest/node_modules files shipped**\n- Typecheck, 33 tests, judge verification, SDK build, and demo build: **PASS**\n\nThe original 5-vulnerability audit and all failed migration runs remain preserved. No force fix was used.\n`);
          NODE
          python3 - <<'PY'
          from pathlib import Path

          p = Path('state/CANONICAL-STATE.yaml')
          text = p.read_text(encoding='utf-8').replace('      - DEPENDENCY_VULNERABILITY_RECONCILIATION\n', '')
          if 'security_gate: PASS_ZERO_NPM_AUDIT' not in text:
              text += '\nsecurity_gate: PASS_ZERO_NPM_AUDIT\n'
          p.write_text(text, encoding='utf-8')

          p = Path('HACKATHON-STATE.yaml')
          text = p.read_text(encoding='utf-8').replace('  dependency_security_reconciliation: OPEN', '  dependency_security_reconciliation: PASS_ZERO_NPM_AUDIT')
          p.write_text(text, encoding='utf-8')

          p = Path('evidence/RECONCILIATION.md')
          text = p.read_text(encoding='utf-8')
          old = '1. **Dependency audit open:** prior `npm ci` reported 5 vulnerabilities (3 moderate, 1 high, 1\n       critical). Exploitability in the shipped browser bundle has not yet been reconciled. This blocks\n       any “security-complete” claim; it does not get silently ignored.\n2. **Live deployment proof:**'
          new = '1. **Dependency security CLOSED:** Vite 7.3.6 + Vitest 5 pass clean full and production npm audits; package dry-run confirms the dev toolchain is not shipped. See `evidence/security/SECURITY-GATE.md`.\n2. **Live deployment proof:**'
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          p = Path('evidence/GATE-REPORT.md')
          text = p.read_text(encoding='utf-8')
          marker = '| BUILD / correctness | PASS | prior CI + CodeQL green; this branch re-runs check/build |'
          if '| DEPENDENCY SECURITY |' not in text:
              text = text.replace(marker, marker + '\n| DEPENDENCY SECURITY | PASS | Vite 7.3.6 + Vitest 5; full + production npm audit = 0; package boundary verified |')
          p.write_text(text, encoding='utf-8')

          p = Path('.pbpd/state/ACTIVITY-TRACE.yaml')
          text = p.read_text(encoding='utf-8').replace('      - DEPENDENCY_VULNERABILITY_RECONCILIATION\n', '')
          if 'stage: dependency-security-reconciliation' not in text:
              text += '\n  - id: A-005\n    stage: dependency-security-reconciliation\n    outcome: PASS_ZERO_NPM_AUDIT\n    evidence:\n      - evidence/security/SECURITY-GATE.md\n      - evidence/security/npm-audit-post-upgrade.json\n      - evidence/security/npm-audit-production.json\n      - evidence/security/npm-pack-dry-run.json\n'
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify canonical evidence after closure
        run: npm run judge:verify

      - name: Commit product and evidence changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/sdk/state-machine.test.ts evidence state HACKATHON-STATE.yaml .pbpd/state/ACTIVITY-TRACE.yaml
          git commit -m "fix: close dependency security gate"
          git push origin finalization-security-runtime
