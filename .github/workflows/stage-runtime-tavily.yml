name: Stage Tavily runtime artifact

on:
  push:
    branches: [runtime-deploy-tavily]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: runtime-deploy-tavily
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Stage immutable runtime assets
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          rm -rf runtime-ready
          mkdir -p runtime-ready
          cp -R dist-demo/. runtime-ready/
          cat > runtime-ready/build.json <<JSON
          {
            "product": "QuickSpin",
            "sourceSha": "${SOURCE_SHA}",
            "environment": "production",
            "searchProvider": "Tavily",
            "runtimeMode": "Vercel function + immutable GitHub assets"
          }
          JSON

      - name: Commit staged runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-ready
          git rm .github/workflows/stage-runtime-tavily.yml
          git commit -m "build: stage Tavily runtime artifact [skip ci]"
          git push origin HEAD:runtime-deploy-tavily
